[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbio-singlecell"
description = "Single-cell analysis nodes for ComfyUI."
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "scanpy[leiden]>=1.12.3,<1.13",
    "anndata>=0.13.2,<0.14",
]

[project.optional-dependencies]
dev = [
    "pillow>=11,<13",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.comfy]
# Add the exact Registry PublisherId after the publisher account is created.
DisplayName = "openbio-singlecell"
requires-comfyui = ">=0.33.0"
web = "web"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["openbio_singlecell*"]
