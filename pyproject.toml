[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbio-singlecell"
description = "Single-cell analysis nodes for ComfyUI."
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "scanpy[leiden,scrublet]>=1.12.3,<1.13",
    "anndata>=0.13.2,<0.14",
    "pillow>=11,<13",
]

[project.optional-dependencies]
celltypist = [
    "celltypist>=1.7,<2",
]
decoupler = [
    "decoupler==2.2.0",
]
harmony = [
    "harmonypy==2.0.0",
]
scvi = [
    "scvi-tools>=1.5,<1.6",
]
pertpy = [
    "pertpy==1.3.0",
]
composition = [
    "pertpy[tcoda]==1.3.0",
]
milo = [
    "pertpy[milo-edger]==1.3.0",
]
pseudobulk = [
    "decoupler==2.2.0",
    "pertpy[de]==1.3.0",
    "pydeseq2>=0.5,<0.6",
]
liana = [
    "liana==1.9.0",
    "pandas<3",
]
velocity = [
    "scvelo==0.3.4",
]
cnv = [
    "infercnvpy==0.6.1",
]
cnmf = [
    "cnmf==1.7.1",
]
lineage = [
    "cassiopeia-mt==2.1.3; platform_system == 'Linux'",
]
forceatlas2 = [
    "fa2-modified==0.4",
]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.comfy]
# Add the exact Registry PublisherId after the publisher account is created.
DisplayName = "openbio-singlecell"
requires-comfyui = ">=0.33.0"
web = "web"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["openbio_singlecell*"]
